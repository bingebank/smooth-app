  <!-- midrib and two veins -->
  <g fill="none" stroke="#2F6B21" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 54 43 21"/>
    <path d="M25 41 24 28"/>
    <path d="M25 41 38 40"/>
  </g>
</svg>
